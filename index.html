<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇵🇸 PALESTINA LIBRE 🇵🇸</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Arial Black, Arial, sans-serif;
  color: white; min-height: 100vh; text-align: center;
  background: url('logo.png') no-repeat center center fixed;
  background-size: cover; position: relative;
}
body::before {
  content: ""; position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: -1;
}
.container { padding: 30px 20px; }
h1 { font-size: 45px; text-shadow: 0 0 20px red; }
.logo-principal { width: 85%; max-width: 360px; border-radius: 20px; border: 3px solid white; margin: 25px 0; box-shadow: 0 0 25px white; }
.botones { max-width: 380px; margin: 20px auto; display: flex; flex-direction: column; gap: 15px; }
.btn {
  padding: 18px; border-radius: 15px; background: #111; color: white;
  border: 2px solid white; font-size: 18px; font-weight: bold; cursor: pointer;
}
.btn:hover { background: white; color: black; }

/* MODAL ADVERTENCIA */
#modal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.9); z-index: 9999;
  justify-content: center; align-items: center;
}
.modal-box {
  background: #111; border: 3px solid #ff0000; border-radius: 20px;
  padding: 30px 20px; max-width: 350px; width: 90%;
  box-shadow: 0 0 40px red;
  animation: entrada 0.5s ease-out;
}
@keyframes entrada {
  from { transform: scale(0.5) translateY(-100px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}
.modal-box h2 { color: #ff0000; font-size: 26px; margin-bottom: 10px; }
#contador { font-size: 50px; color: yellow; margin: 15px 0; }
.modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
.modal-btns button {
  flex: 1; padding: 12px; border-radius: 10px; border: none;
  font-weight: bold; font-size: 16px; cursor: pointer;
}
#btnSi { background: #009736; color: white; }
#btnSi:disabled { background: #555; opacity: 0.5; }
#btnNo { background: #CE1126; color: white; }
</style>
</head>
<body>
<div class="container">
  <h1>🇵🇸 PALESTINA LIBRE 🇵🇸</h1>
  <img src="logo.png" class="logo-principal">
  <div class="botones">
    <button class="btn" onclick="abrirAdvertencia('https://es.wikipedia.org/wiki/Historia_de_Palestina')">📜 HISTORIA REAL DE PALESTINA</button>
    <button class="btn" onclick="abrirAdvertencia('https://es.wikipedia.org/wiki/Franja_de_Gaza')">📍 QUE ESTA PASANDO EN GAZA</button>
    <button class="btn" onclick="abrirAdvertencia('https://www.un.org/unrwa/es')">🌍 AYUDA HUMANITARIA</button>
    <button class="btn" onclick="abrirAdvertencia('https://es.wikipedia.org/wiki/Conflicto_israeli-palestino')">⚠️ VERDAD DEL CONFLICTO</button>
  </div>
</div>

<div id="modal">
  <div class="modal-box">
    <h2>⚠️ ADVERTENCIA ⚠️</h2>
    <p style="font-size:18px; margin:10px 0;">¿SEGURO QUE QUIERES LEER ESTO?</p>
    <p style="font-size:14px; opacity:0.8;">Este contenido puede ser fuerte</p>
    <div id="contador">6</div>
    <p style="font-size:13px;">Espera para decidir...</p>
    <div class="modal-btns">
      <button id="btnNo" onclick="cerrarModal()">NO</button>
      <button id="btnSi" disabled onclick="irLink()">SI (6)</button>
    </div>
  </div>
</div>

<script>
let linkDestino = "";
let intervalo;
function abrirAdvertencia(url) {
  linkDestino = url;
  document.getElementById('modal').style.display = 'flex';
  let seg = 6;
  document.getElementById('contador').innerText = seg;
  document.getElementById('btnSi').disabled = true;
  document.getElementById('btnSi').innerText = `SI (${seg})`;
  intervalo = setInterval(() => {
    seg--;
    document.getElementById('contador').innerText = seg;
    document.getElementById('btnSi').innerText = `SI (${seg})`;
    if(seg <= 0) {
      clearInterval(intervalo);
      document.getElementById('contador').innerText = "✓";
      document.getElementById('btnSi').innerText = "SI, QUIERO LEER";
      document.getElementById('btnSi').disabled = false;
    }
  }, 1000);
}
function cerrarModal() {
  clearInterval(intervalo);
  document.getElementById('modal').style.display = 'none';
}
function irLink() {
  cerrarModal();
  window.open(linkDestino, '_blank');
}
</script>
</body>
</html>
